spring.application.name=canchas-integrator
server.port=8080
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
# formularios HTML con PUT y DELETE (campo oculto _method)
spring.mvc.hiddenmethod.filter.enabled=true
# fechas de formularios y parametros en formato yyyy-MM-dd
spring.mvc.format.date=iso

# ---- Microsoft SQL Server ----
# La base "canchas" y su login se crean una vez con database/crear-base.sql; las tablas las crea la aplicacion.
# instanceName usa el servicio SQL Server Browser para encontrar el puerto de la instancia con nombre.
# Instancia por defecto: jdbc:sqlserver://localhost:1433;databaseName=canchas;encrypt=true;trustServerCertificate=true
# Se pueden reemplazar con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
app.db.url=jdbc:sqlserver://localhost;instanceName=MSSQLSERVER01;databaseName=canchas;encrypt=true;trustServerCertificate=true
app.db.username=canchas
app.db.password=Canchas#2026dev

# ---- Cuenta de administracion que se crea la primera vez (variables ADMIN_USER y ADMIN_PASSWORD) ----
app.admin.username=admin
app.admin.password=admin123

# ---- API REST (Javalin) ----
app.rest.port=7070

# ---- Idioma de las fechas en las vistas (lunes, martes...) ----
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
