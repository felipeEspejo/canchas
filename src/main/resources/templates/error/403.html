<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tarjeta roja')}"></head>
<body class="stadium-body">
<main class="incident-stage">
    <section class="incident-board incident-board--red">
        <div class="incident-visual" aria-hidden="true"><div class="red-card-prop"></div></div>
        <span class="chip chip--red">INCIDENCIA 403</span>
        <h1 class="stadium-title">TARJETA ROJA</h1>
        <p style="color: var(--chalk-soft);">No tienes permisos para acceder a esta zona del estadio. Pide ayuda a un administrador.</p>
        <p class="mono-code" style="color: var(--muted);" th:if="${message}" th:text="${message}"></p>
        <a th:href="@{/}" class="btn-kick btn-kick--lime">VOLVER A LA AGENDA</a>
    </section>
</main>
</body>
</html>
