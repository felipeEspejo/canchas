<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Falla en el marcador')}"></head>
<body class="stadium-body">
<main class="incident-stage">
    <section class="incident-board incident-board--red">
        <div class="incident-visual" aria-hidden="true"><span class="led-value led-value--red" style="font-size: 2.2rem;">ERR</span></div>
        <span class="chip chip--red">INCIDENCIA 500</span>
        <h1 class="stadium-title">FALLA EN EL MARCADOR</h1>
        <p style="color: var(--chalk-soft);">Ha ocurrido un error interno. Inténtalo de nuevo en unos minutos.</p>
        <p class="mono-code" style="color: var(--muted);" th:if="${message}" th:text="${message}"></p>
        <a th:href="@{/}" class="btn-kick btn-kick--lime">VOLVER A LA AGENDA</a>
    </section>
</main>
</body>
</html>
