<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jugada no completada')}"></head>
<body class="stadium-body">
<main class="incident-stage">
    <section class="incident-board incident-board--amber">
        <div class="incident-visual" aria-hidden="true"><span class="led-value led-value--amber" style="font-size: 2.2rem;">!</span></div>
        <span class="chip chip--amber">INCIDENCIA</span>
        <h1 class="stadium-title">JUGADA NO COMPLETADA</h1>
        <p style="color: var(--chalk-soft);">No se pudo completar la solicitud. Vuelve a intentarlo.</p>
        <p class="mono-code" style="color: var(--muted);" th:if="${message}" th:text="${message}"></p>
        <a th:href="@{/}" class="btn-kick btn-kick--lime">VOLVER A LA AGENDA</a>
    </section>
</main>
</body>
</html>
