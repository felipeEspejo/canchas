# Gradle escribe la lista de clases de las pruebas en un archivo (@argfile) con la codificacion de su propia JVM.
# Java lo lee con la codificacion del sistema (en Windows en espanol, Cp1252). Con COMPAT, Gradle usa la del sistema
# y las pruebas funcionan aunque la ruta del proyecto tenga tildes (por ejemplo ...\Imagenes con tilde\...).
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=COMPAT
